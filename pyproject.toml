[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jlink-mcp"
version = "0.2.0"
description = "AI 与 JLink 调试器的桥梁 - MCP 服务器（修复 pylink-square 2.x 兼容性）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cyj0920", email = "cyjie0920@gmail.com" },
]
keywords = ["debugger", "embedded", "jlink", "mcp", "mcu", "segger"]
dependencies = [
    "mcp>=1.26.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "pylink-square>=2.0.0",
]

[project.scripts]
jlink-mcp = "jlink_mcp.server:main"

[tool.setuptools.packages.find]
include = ["jlink_mcp*"]
