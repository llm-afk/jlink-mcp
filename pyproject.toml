[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jlink-mcp"
version = "0.5.1"
description = "面向嵌入式调试的精简 J-Link MCP 服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cyj0920", email = "cyjie0920@gmail.com" },
]
keywords = ["debugger", "embedded", "jlink", "mcp", "mcu", "segger"]
dependencies = [
    "mcp>=1.26.0,<2",
    "pydantic>=2.12.0",
    "pylink-square>=2.0.0",
    "pyelftools>=0.31",
    "psutil>=5.9",
    "capstone>=5.0.3,<6",
]

[project.scripts]
jlink-mcp = "jlink_mcp.server:main"

[tool.setuptools.packages.find]
include = ["jlink_mcp*"]

[tool.setuptools.package-data]
jlink_mcp = ["tool/SVD_V1.5.6/*.svd"]
